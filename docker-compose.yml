services:
  postgres:
    image: postgres:16-alpine
    container_name: tonanza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jackpot_pvp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jackpot_pvp"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
